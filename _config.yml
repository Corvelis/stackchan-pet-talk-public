title: StackChan Pet Talk
description: Public documentation, privacy policy, and support pages for StackChan Pet Talk.
theme: jekyll-theme-primer

plugins:
  - jekyll-relative-links
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-default-layout
  - jekyll-titles-from-headings

relative_links:
  enabled: true
  collections: true
